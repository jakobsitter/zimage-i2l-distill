[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zimage-i2l-distill"
version = "0.1.0"
description = "Bootstrap repository for zimage image-to-LoRA distillation work"
requires-python = ">=3.10"

[project.scripts]
zimage-distill-pairs = "zimage_distill.teacher_pairs:main"
zimage-distill-infer = "zimage_distill.infer:main"
zimage-distill-generate = "zimage_distill.generate:main"
zimage-distill-direct-generate = "zimage_distill.direct_generate:main"
zimage-distill-train-style-bridge = "zimage_distill.train_style_bridge:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
